add_newline = true
command_timeout = 1000
format = "$username$hostname$directory$git_status$line_break$character"
right_format = "$git_branch$status$cmd_duration$python$kubernetes"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[username]
show_always = false
format = "[$user]($style)@"

[hostname]
ssh_only = true
format = "[$hostname]($style):"

[directory]
truncate_to_repo = true
truncation_length = 2
truncation_symbol = "…/"

[git_branch]
format = " [$symbol$branch]($style) "

[cmd_duration]
min_time = 5000
format = "[$duration]($style) "

[status]
format = "[$symbol$status]($style) "
symbol = "✖"

[python]
detect_extensions = []
detect_files = []
detect_folders = []
detect_env_vars = ["VIRTUAL_ENV"]
format = "[$symbol$virtualenv]($style) "

[kubernetes]
format = "[⎈ $context]($style) "
